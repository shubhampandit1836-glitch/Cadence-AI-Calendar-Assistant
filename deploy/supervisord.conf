[supervisord]
nodaemon=true

[program:postgres]
command=su postgres -c "/usr/lib/postgresql/*/bin/postgres -D /var/lib/postgresql/data"
autorestart=true
priority=1

[program:backend]
command=uvicorn src.main:app --host 0.0.0.0 --port 4000
directory=/app/backend
environment=DATABASE_URL="postgresql://app:apppassword@localhost:5432/agentic_calendar_db"
autorestart=true
priority=2

[program:frontend]
command=node server.js
directory=/app/frontend
environment=PORT="10000"
autorestart=true
priority=3