[supervisord]
nodaemon=true

[program:postgres]
command=/bin/sh -c "su postgres -c '$(find /usr/lib/postgresql -name postgres | head -n1) -D /var/lib/postgresql/data'"
autorestart=true
priority=1

[program:backend]
command=uvicorn src.main:app --host 0.0.0.0 --port 4000
directory=/app/backend
environment=DATABASE_URL="postgresql://app:apppassword@localhost:5432/agentic_calendar_db"
autorestart=true
priority=2

[program:frontend]
command=node server.js
directory=/app/frontend
environment=PORT="10000"
autorestart=true
priority=3
