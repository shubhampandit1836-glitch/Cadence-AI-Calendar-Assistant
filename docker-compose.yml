services:
  agentic_calendar_db:
    image: pgvector/pgvector:pg16
    container_name: agentic_calendar_app_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: agentic_calendar_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: agentic_calendar_backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@agentic_calendar_db:5432/agentic_calendar_db
    ports:
      - "4000:4000"
    depends_on:
      agentic_calendar_db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
        NEXT_PUBLIC_DESCOPE_PROJECT_ID: ${NEXT_PUBLIC_DESCOPE_PROJECT_ID}
    container_name: agentic_calendar_frontend
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata: